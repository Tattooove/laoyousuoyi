/* ============================================================
   六、赔偿测算：两条公式
   ============================================================ */
function calcWage(v, relation){
  var lines = [];
  var principal = num(v.wage) * num(v.arrearsMonths);
  lines.push({n:'拖欠工资本金', f:'月工资 ' + money(num(v.wage)) + ' 元 × ' + money(num(v.arrearsMonths)) + ' 个月', v:money(principal) + ' 元'});
  var low = principal, high = principal;
  if(relation === '劳动'){
    var addLow = principal * CONFIG.wageAddOn[0];
    var addHigh = principal * CONFIG.wageAddOn[1];
    lines.push({n:'加付赔偿金（责令支付后仍不支付时）', f:'本金 × 50%—100%', v:money(addLow) + ' — ' + money(addHigh) + ' 元'});
    low = principal + addLow;
    high = principal + addHigh;
  } else {
    var lossHigh = principal * 0.05;
    lines.push({n:'逾期资金占用损失（演示估算）', f:'本金 × 0%—5%', v:'0 — ' + money(lossHigh) + ' 元'});
    high = principal + lossHigh;
  }
  return {low:low, high:high, lines:lines};
}
function calcInjuryService(v){
  var c = CONFIG.laborService;
  var lines = [];
  var medical = num(v.medical);
  var nurseDays = num(v.nurse);
  var daily = num(v.wage) > 0 ? num(v.wage) / 21.75 : c.lostWageDaily;
  var lost = num(v.days) * daily;
  var nurse = nurseDays * c.nursingDaily;
  var food = nurseDays * c.foodDaily;
  var nutrition = nurseDays * c.nutritionDaily;
  var disability = c.disabilityBase * (c.gradeRatio[v.grade] || 0);
  var items = [
    {n:'医疗费', f:'按演示输入金额', v:medical},
    {n:'误工费', f:money(num(v.days)) + ' 天 × ' + money(daily) + ' 元/天', v:lost},
    {n:'护理费', f:money(nurseDays) + ' 天 × ' + c.nursingDaily + ' 元/天', v:nurse},
    {n:'住院伙食补助费', f:money(nurseDays) + ' 天 × ' + c.foodDaily + ' 元/天', v:food},
    {n:'营养费', f:money(nurseDays) + ' 天 × ' + c.nutritionDaily + ' 元/天', v:nutrition},
    {n:'交通费', f:'演示定额', v:c.trafficLump},
    {n:'残疾赔偿金（按伤残等级折算）', f:'演示简化值 ' + money(c.disabilityBase) + ' 元 × ' + Math.round((c.gradeRatio[v.grade] || 0) * 100) + '%；法定口径＝受诉法院地上一年度城镇居民人均可支配收入 × 20 年 × 伤残系数', v:disability}
  ];
  items.forEach(function(it){
    lines.push({n:it.n, f:it.f, v:money(it.v) + ' 元'});
  });
  var subtotal = items.reduce(function(s, it){ return s + it.v; }, 0);
  lines.push({n:'小计（民法典第1179条项目合计）', f:'以上各项相加', v:money(subtotal) + ' 元'});
  var low = subtotal * c.faultShare[0];
  var high = subtotal * c.faultShare[1];
  lines.push({
    n:'过错分担（民法典第1192条）',
    f:'用工方承担 ' + Math.round(c.faultShare[0] * 100) + '%—' + Math.round(c.faultShare[1] * 100) + '%',
    v:money(low) + ' — ' + money(high) + ' 元'
  });
  return {low:low, high:high, lines:lines};
}
function calcInjuryWork(v){
  var c = CONFIG.workInjury;
  var lines = [];
  var medical = num(v.medical);
  var wage = num(v.wage);
  var stopMonths = num(v.months);
  var nurseDays = num(v.nurse);
  var grades = v.grade === '未鉴定' ? ['十级','七级'] : [v.grade, v.grade];
  function one(g){
    return {
      a1: wage * c.gradeMonths[g],
      a2: wage * c.medicalSubsidyMonths[g],
      a3: wage * c.jobSubsidyMonths[g],
      stopPay: wage * stopMonths,
      nurse: nurseDays * c.nursingDaily,
      food: nurseDays * c.foodDaily
    };
  }
  var lo = one(grades[0]), hi = one(grades[1]);
  function range(a, b){
    return Math.abs(a - b) < 1 ? money(a) : money(a) + ' — ' + money(b);
  }
  lines.push({n:'医疗费（符合目录部分）', f:'按演示输入金额', v:money(medical) + ' 元'});
  lines.push({n:'停工留薪期工资', f:money(stopMonths) + ' 个月 × ' + money(wage) + ' 元/月', v:money(lo.stopPay) + ' 元'});
  lines.push({n:'一次性伤残补助金', f:grades[0] + ' ' + c.gradeMonths[grades[0]] + ' 个月 / ' + grades[1] + ' ' + c.gradeMonths[grades[1]] + ' 个月', v:range(lo.a1, hi.a1) + ' 元'});
  lines.push({n:'一次性工伤医疗补助金', f:'演示月数，以四川省 / 成都市现行标准校准（' + grades[0] + ' ' + c.medicalSubsidyMonths[grades[0]] + ' 个月 / ' + grades[1] + ' ' + c.medicalSubsidyMonths[grades[1]] + ' 个月）', v:range(lo.a2, hi.a2) + ' 元'});
  lines.push({n:'一次性伤残就业补助金', f:'演示月数，以四川省 / 成都市现行标准校准（' + grades[0] + ' ' + c.jobSubsidyMonths[grades[0]] + ' 个月 / ' + grades[1] + ' ' + c.jobSubsidyMonths[grades[1]] + ' 个月）', v:range(lo.a3, hi.a3) + ' 元'});
  lines.push({n:'护理费', f:money(nurseDays) + ' 天 × ' + c.nursingDaily + ' 元/天', v:money(lo.nurse) + ' 元'});
  lines.push({n:'住院伙食补助费', f:money(nurseDays) + ' 天 × ' + c.foodDaily + ' 元/天', v:money(lo.food) + ' 元'});
  var low = medical + lo.a1 + lo.a2 + lo.a3 + lo.stopPay + lo.nurse + lo.food;
  var high = medical + hi.a1 + hi.a2 + hi.a3 + hi.stopPay + hi.nurse + hi.food;
  lines.push({n:'合计（工伤保险条例待遇项目）', f:v.grade === '未鉴定' ? '按十级至七级区间估算' : '按所选伤残等级估算', v:money(low) + ' — ' + money(high) + ' 元'});
  return {low:low, high:high, lines:lines};
}
function runCalc(){
  var v = APP.calc;
  var r;
  if(v.mode === 'wage'){
    r = calcWage(v, v.relation);
  } else {
    r = v.relation === '劳动' ? calcInjuryWork(v) : calcInjuryService(v);
  }
  r.relation = v.relation;
  r.mode = v.mode;
  APP.calcResult = r;
  render();
  document.getElementById('view').scrollTop = 0;
}

function copyDoc(){
  var d = buildDoc();
  if(!d.name){ toast(d.reason); return; }
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = d.text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); toast(t('docCopied')); }
    catch(err){ toast(t('docCopyFail')); }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(d.text).then(function(){ toast(t('docCopied')); }, fallback);
  } else { fallback(); }
}
function downloadDoc(){
  var d = buildDoc();
  if(!d.name){ toast(d.reason); return; }
  var blob = new Blob([d.text], {type:'text/plain;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var aEl = document.createElement('a');
  aEl.href = url;
  aEl.download = d.name.replace(/[（(].*$/, '') + '（演示）.txt';
  document.body.appendChild(aEl);
  aEl.click();
  document.body.removeChild(aEl);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  toast(t('docSaved'));
}

    '</div>' +
    '<div class="seg">' +
      '<button class="' + (v.relation === '劳务' ? 'active' : '') + '" data-act="calcrel" data-v="劳务">' + esc(t('relLabor')) + '</button>' +
      '<button class="' + (v.relation === '劳动' ? 'active' : '') + '" data-act="calcrel" data-v="劳动">' + esc(t('relWork')) + '</button>' +
    '</div>' +
    '<div class="card">' + (v.mode === 'wage' ? wageForm : injuryForm) +
      '<button class="btn primary" style="width:100%" data-act="runcalc">' + esc(t('calcBtn')) + '</button>' +
    '</div>' + resultHtml +
    '<div class="note">' + esc(t('bilingualNote')) + '</div>';
}
function viewHelp(){
  return '<div class="h1" style="font-size:1.25rem">' + esc(t('helpTitle')) + '</div>' +
    '<div class="card">' +
      '<div class="h2">' + esc(t('help12348')) + '</div>' +
      '<div class="result-money" style="color:var(--blue)">12348</div>' +
      '<button class="bigbtn warm" data-act="nodial"><span class="bi">拨</span><span class="bt">模拟拨打<span class="bs">' + esc(t('noDial')) + '</span></span></button>' +
    '</div>' +
    '<div class="note blue">' + esc(t('helpTip')) + '</div>' +
    '<button class="btn primary" style="width:100%" data-act="todoc">' + esc(t('docBtn')) + '</button>';
}
function viewMine(){
  var fonts = [
    {v:1, label:t('font1')}, {v:2, label:t('font2')}, {v:3, label:t('font3')}
  ];
  return '<div class="h1" style="font-size:1.25rem">' + esc(t('mineTitle')) + '</div>' +
    '<div class="card"><div class="h2" style="font-size:1rem">' + esc(t('fontLabel')) + '</div>' +
      '<div class="chips">' + fonts.map(function(x){
        return '<button class="chip' + (APP.fontLevel === x.v ? ' active' : '') + '" data-act="setfont" data-v="' + x.v + '">' + esc(x.label) + '</button>';
      }).join('') + '</div>' +
    '</div>' +
    '<div class="card"><div class="h2" style="font-size:1rem">' + esc(t('demoLabel')) + '</div>' +
      DEMO_CASES.map(function(c){
        return '<button class="opt" data-act="loadcase" data-v="' + c.id + '">' + esc(c.title) + '</button>';
      }).join('') +
    '</div>' +
    '<div class="card"><div class="h2" style="font-size:1rem">' + esc(t('disclaimerLabel')) + '</div>' +
      '<div class="p">' + esc(DISCLAIMER) + '</div>' +
      '<div class="h2" style="font-size:1rem;margin-top:.6rem">' + esc(t('about')) + '</div>' +
      '<div class="p">' + esc(t('aboutText')) + '</div>' +
    '</div>';
}
function viewCases(){
  return '<div class="h1" style="font-size:1.25rem">' + esc(t('demoLabel')) + '</div>' +
    '<div class="p">' + esc(t('bilingualNote')) + '</div>' +
    DEMO_CASES.map(function(c){
      return '<button class="bigbtn ghost" data-act="loadcase" data-v="' + c.id + '">' +
        '<span class="bi">' + c.id + '</span><span class="bt">' + esc(c.title) + '<span class="bs">点一下直接看诊断结果</span></span>' +
      '</button>';
    }).join('') +
    '<button class="btn" style="width:100%" data-act="backhome">' + esc(t('backHome')) + '</button>';
}

function viewDoc(){
  var d = buildDoc();
  if(!d.name){
    return '<div class="h1" style="font-size:1.25rem">' + esc(t('docTitle')) + '</div>' +
      '<div class="note">' + esc(d.reason) + '</div>' +
      '<button class="btn" style="width:100%" data-act="backhome">' + esc(t('backHome')) + '</button>';
  }
  return '<div class="h1" style="font-size:1.25rem">' + esc(t('docTitle')) + '</div>' +
    '<div class="p">' + esc(t('docTip')) + '</div>' +
    '<div class="note blue"><span class="tag">' + esc(t('docTplLabel')) + '</span>' + esc(d.name) + '</div>' +
    '<div class="card doctext" id="docText">' + esc(d.text) + '</div>' +
    '<div class="btnrow">' +
      '<button class="btn primary" style="flex:1" data-act="copydoc">' + esc(t('docCopy')) + '</button>' +
      '<button class="btn" style="flex:1" data-act="downloaddoc">' + esc(t('docDownload')) + '</button>' +
    '</div>' +
    '<div class="note">' + esc(t('bilingualNote')) + '</div>';
}

var VIEWS = {
  onboard:viewOnboard, home:viewHome, type:viewType, quiz:viewQuiz,
  result:viewResult, law:viewLaw, evidence:viewEvidence, path:viewPath,
  calc:viewCalc, help:viewHelp, mine:viewMine, cases:viewCases, doc:viewDoc
};
function titlesFor(screen){
  var map = {
    onboard:'欢迎', home:'“劳”有所依', type:t('typeTitle'), quiz:t('quizTitle'),
    result:'诊断结果', law:t('lawTitle'), evidence:t('evidenceTitle'), path:t('pathTitle'),
    calc:t('calcTitle'), help:t('helpTitle'), mine:t('mineTitle'), cases:t('demoLabel'),
    doc:t('docTitle')
  };
  return map[screen] || '“劳”有所依';
}
function render(){
  applyFont();
  var showBack = !['onboard','home'].includes(APP.screen) && APP.stack.length > 0;
  document.getElementById('topbar').innerHTML =
    (showBack ? '<button class="tb-back" data-act="back">' + esc(t('back')) + '</button>' : '') +
    '<div class="tb-title">' + esc(titlesFor(APP.screen)) + '</div>' +
    '<div class="tb-tools">' +
      '<button class="tool" data-act="font" title="字体大小">字</button>' +
      '<button class="tool' + (APP.voice ? ' on' : '') + '" data-act="voice" title="语音播报">读</button>' +
    '</div>';
  renderTabs();
  document.getElementById('view').innerHTML = (VIEWS[APP.screen] || viewHome)();
}

/* ============================================================
   八、事件处理
   ============================================================ */
function loadCase(id){
  var c = DEMO_CASES.filter(function(x){ return x.id === id; })[0];
  if(!c) return;
  APP.currentCase = c.id;
  APP.answers = {type:c.type};
  Object.keys(c.answers).forEach(function(k){ APP.answers[k] = c.answers[k]; });
  APP.calc = JSON.parse(JSON.stringify(c.calc));
  APP.calcResult = null;
  go('result');
}
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(!el) return;
  var act = el.getAttribute('data-act');
  var val = el.getAttribute('data-v');
  switch(act){
    case 'back': back(); break;
    case 'obnext':
      if(APP.slide < 2){ APP.slide++; render(); }
      else { APP.slide = 0; go('home'); }
      break;
    case 'skip': APP.slide = 0; go('home'); break;
    case 'tab':
      if(val === APP.screen) break;
      if(val === 'type'){ APP.stack = []; go('type'); }
      else { go(val); }
      break;
    case 'start': APP.stack = []; go('type'); break;
    case 'demos': go('cases'); break;
    case 'tocalc':
      APP.calcResult = null;
      if(!APP.answers.pension){ APP.calc.relation = '劳务'; }
      else { APP.calc.relation = APP.answers.pension === '还没领' ? '劳动' : APP.answers.pension === '已经领了' ? '劳务' : '劳务'; }
      APP.calc.mode = (APP.answers.type === 'wage' || APP.answers.type === 'overtime') ? 'wage' : 'injury';
      go('calc');
      break;
    case 'picktype':
      APP.answers.type = val;
      APP.qIndex = 0;
      go('quiz');
      break;
    case 'pickopt':
      APP.answers[QUESTIONS[APP.qIndex].id] = val;
      render();
      break;
    case 'qnext':
      if(!APP.answers[QUESTIONS[APP.qIndex].id]){ toast('请先选一个答案'); break; }
      APP.qIndex = Math.min(APP.qIndex + 1, QUESTIONS.length - 1);
      render();
      break;
    case 'qprev':
      APP.qIndex = Math.max(APP.qIndex - 1, 0);
      render();
      break;
    case 'finish':
      if(!APP.answers[QUESTIONS[APP.qIndex].id]){ toast('请先选一个答案'); break; }
      go('result');
      break;
    case 'showlaw': go('law'); break;
    case 'showevi': go('evidence'); break;
    case 'showpath': go('path'); break;
    case 'backhome': APP.stack = []; go('home'); break;
    case 'check': APP.checked[val] = el.checked; render(); break;
    case 'font':
      APP.fontLevel = APP.fontLevel === 3 ? 1 : APP.fontLevel + 1;
      render();
      break;
    case 'setfont': APP.fontLevel = parseInt(val, 10); render(); break;
    case 'voice':
      APP.voice = !APP.voice;
      render();
      if(APP.voice) speakScreen(); else toast('已关闭语音播报');
      break;
    case 'calcmode': APP.calc.mode = val; APP.calcResult = null; render(); break;
    case 'calcrel': APP.calc.relation = val; APP.calcResult = null; render(); break;
    case 'runcalc': runCalc(); break;
    case 'again': APP.calcResult = null; render(); break;
    case 'nodial': toast('演示原型，不实际拨号'); break;
    case 'loadcase': loadCase(val); break;
    case 'todoc': go('doc'); break;
    case 'copydoc': copyDoc(); break;
    case 'downloaddoc': downloadDoc(); break;
  }
});
document.addEventListener('change', function(e){
  var el = e.target.closest('[data-act]');
  if(!el) return;
  if(el.getAttribute('data-act') === 'calcfield'){
    APP.calc[el.getAttribute('data-v')] = el.value;
  }
});

render();
</script>
